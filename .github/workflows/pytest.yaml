name: pytest
on:
  push:
    branches:
      # Run tests for change on the main branch ...
      - main
    tags-ignore:
      # ... but not for tags (avoids duplicate work) ...
      - '**'
    paths:
      # ... and only if relevant files have changed.
      - stepup/**
      - tests/**
      - pyproject.toml
      - .gitattributes
      - .github/workflows/pytest.yaml
  pull_request:
    # Run tests on pull requests ...
    paths:
      # ... only if relevant files have changed.
      - stepup/**
      - tests/**
      - pyproject.toml
      - .gitattributes
      - .github/workflows/pytest.yaml

# The steps are written for bash, which is the bash of Git for Windows on the Windows runners.
defaults:
  run:
    shell: bash

jobs:
  tests:
    permissions:
      contents: read
    env:
      # Enforce strict checks instead of trying to repair fixable issues.
      STEPUP_DEBUG: 1
      # Duration measurements are disabled to make tests deterministic.
      STEPUP_BUILD_DURATION: 0
      # RPC timeout is set shorter to speed up tests in case of failures.
      STEPUP_SYNC_RPC_TIMEOUT: 10
      # The Tectonic version is also part of the cache key of its downloads.
      TECTONIC_VERSION: 0.17.0
    strategy:
      # A failure on one platform should not hide the results of the other platforms.
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            python-version: '3.11'
            resolution: lowest-direct
          - runner: ubuntu-26.04
            python-version: '3.14'
            resolution: highest
          - runner: ubuntu-26.04
            python-version: '3.15-dev'
            resolution: highest
          - runner: windows-2022
            python-version: '3.11'
            resolution: lowest-direct
          - runner: windows-2025
            python-version: '3.14'
            resolution: highest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        timeout-minutes: 1
      - name: Set up Python ${{ matrix.python-version }}
        timeout-minutes: 1
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        timeout-minutes: 1
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install Tectonic
        timeout-minutes: 3
        uses: wtfjoke/setup-tectonic@v4
        with:
          tectonic-version: ${{ env.TECTONIC_VERSION }}
      - name: Configure fontconfig for Tectonic
        # The reason is explained under "Tests on Windows" in docs/development.md.
        # This comes before the warm-up, so that the font cache is also built there.
        if: runner.os == 'Windows'
        run: |
          FONTCONFIG_FILE=$(cygpath -w "${GITHUB_WORKSPACE}/tools/fonts.conf")
          echo "FONTCONFIG_FILE=${FONTCONFIG_FILE}" >> "$GITHUB_ENV"
      - name: Cache the Tectonic downloads
        timeout-minutes: 3
        uses: actions/cache@v6
        with:
          # The parent of `tectonic -X show user-cache-dir`, as observed with Tectonic 0.17.
          # Tectonic 0.16 used `~/.cache/Tectonic` on Linux instead.
          path: >-
            ${{ runner.os == 'Windows'
            && '~/AppData/Local/TectonicProject/Tectonic/cache'
            || '~/.cache/tectonic' }}
          key: tectonic-${{ matrix.runner }}-${{ env.TECTONIC_VERSION }}
      - name: Warm up the Tectonic cache
        # On a cache miss, Tectonic downloads its bundle and builds a LaTeX format
        # on first use, which takes far longer than the example tests allow.
        # This document pulls in the same bundle files as the Tectonic examples,
        # so that the cost is paid here instead of inside a test.
        timeout-minutes: 5
        run: |
          mkdir -p "${RUNNER_TEMP}/tectonic-warmup"
          cp .github/warmup.tex "${RUNNER_TEMP}/tectonic-warmup/warmup.tex"
          cp .github/warmup.bib "${RUNNER_TEMP}/tectonic-warmup/warmup.bib"
          tectonic -c minimal "${RUNNER_TEMP}/tectonic-warmup/warmup.tex"
      - name: Install typst
        timeout-minutes: 3
        uses: typst-community/setup-typst@v5
        with:
          typst-version: v0.15.0
      - name: Install with the test dependencies
        # Without precompiled bytecode, the examples that start a Jupyter kernel compile it,
        # which brought `convert_jupyter` close to its deadline on Windows,
        # as observed in a Windows 11 VM with Python 3.14.
        timeout-minutes: 3
        run: >-
          uv pip install --system --compile-bytecode
          --resolution ${{ matrix.resolution }} -e .[tests]
      - name: Run pytest
        timeout-minutes: 15
        continue-on-error: ${{ matrix.python-version == '3.15-dev' }}
        run: pytest -vv

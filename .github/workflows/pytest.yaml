name: pytest
on:
  push:
    branches:
      # Run tests for change on the main branch ...
      - main
    tags-ignore:
      # ... but not for tags (avoids duplicate work) ...
      - '**'
    paths:
      # ... and only if relevant files have changed.
      - stepup/**
      - tests/**
      - pyproject.toml
      - .github/workflows/pytest.yaml
  pull_request:
    # Run tests on pull requests ...
    paths:
      # ... only if relevant files have changed.
      - stepup/**
      - tests/**
      - pyproject.toml
      - .github/workflows/pytest.yaml

jobs:
  tests:
    permissions:
      contents: read
    env:
      # Enforce strict checks instead of trying to repair fixable issues.
      STEPUP_DEBUG: 1
      # Duration measurements are disabled to make tests deterministic.
      STEPUP_BUILD_DURATION: 0
      # RPC timeout is set shorter to speed up tests in case of failures.
      STEPUP_SYNC_RPC_TIMEOUT: 10
      # The Tectonic version is also part of the cache key of its downloads.
      TECTONIC_VERSION: 0.17.0
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            python-version: '3.11'
            resolution: lowest-direct
          - runner: ubuntu-26.04
            python-version: '3.14'
            resolution: highest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install Tectonic
        uses: wtfjoke/setup-tectonic@v4
        with:
          tectonic-version: ${{ env.TECTONIC_VERSION }}
      - name: Cache the Tectonic downloads
        uses: actions/cache@v4
        with:
          # Tectonic 0.16 used `~/.cache/Tectonic` for this instead.
          path: ~/.cache/tectonic
          key: tectonic-${{ matrix.runner }}-${{ env.TECTONIC_VERSION }}
      - name: Warm up the Tectonic cache
        # On a cache miss, Tectonic downloads its bundle and builds a LaTeX format
        # on first use, which takes far longer than the example tests allow.
        # This document pulls in the same bundle files as the Tectonic examples,
        # so that the cost is paid here instead of inside a test.
        run: |
          mkdir -p "${RUNNER_TEMP}/tectonic-warmup"
          cp .github/warmup.tex "${RUNNER_TEMP}/tectonic-warmup/warmup.tex"
          cp .github/warmup.bib "${RUNNER_TEMP}/tectonic-warmup/warmup.bib"
          tectonic -c minimal "${RUNNER_TEMP}/tectonic-warmup/warmup.tex"
      - name: Install typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: v0.15.0
      - name: Install with the test dependencies
        run: uv pip install --system --resolution ${{ matrix.resolution }} -e .[tests]
      - name: Run pytest
        run: pytest -vv
